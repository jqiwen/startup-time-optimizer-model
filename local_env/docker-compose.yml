services:
  app:
    build: ./acmeair
    container_name: app
    ports:
      - "9080:9080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9080/health/ready || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 40
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  sidecar:
    build: ./sidecar
    container_name: sidecar
    environment:
      APP_NAME: "acmeair"
      HEALTH_URL: "http://app:9080/health/ready"
      CPUS: "1.0"
      MEMORY: "1G"
    ports:
      - "9100:9100"
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - sidecar

  grafana:
    image: grafana/grafana:10.4.5
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

networks:
  default:
    driver: bridge
